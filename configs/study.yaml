# Study settings (Chicago, e-bike vs. classic bike), fixed in PROTOCOL.md
seed: 42
target: e_bike

split:
  excluded_before: "2025-02-05"      # previous price regime
  inner_train: ["2025-02-05", "2025-08-24"]
  embargo:     ["2025-08-25", "2025-08-31"]
  valid:       ["2025-09-01", "2025-12-31"]
  final_train: ["2025-02-05", "2025-12-31"]
  test:        ["2026-01-01", "2026-10-31"]

# Never allowed as features (post-choice, identifiers, or time index)
forbidden:
  - duration_min
  - ended_at
  - ride_id
  - start_station_id
  - start_lat
  - start_lng
  - o_tract
  - d_tract
  - started_at
  - datetime_hour
  - year
  - e_bike

features:
  time:        [hour, day_of_week, is_weekend, is_holiday, is_daylight]
  rider:       [is_member]
  weather:     [temp_c, feels_like_c, precip_mm, precip_prev3h_mm, snow_cm, wind_kmh, humidity_pct, cloud_pct]
  trip:        [dist_km, round_trip, same_tract]
  origin:      [o_dist_cbd_km, o_pop_density_km2, o_job_density_km2, o_median_income, o_median_age,
                o_pct_age_18_29, o_pct_degree, o_pct_hh_no_car, o_pct_commute_transit,
                o_pct_commute_bicycle, o_pct_commute_walk, o_pct_commute_wfh, o_pct_jobs_retail_food]
  destination: [d_dist_cbd_km, d_pop_density_km2, d_job_density_km2, d_median_income, d_median_age,
                d_pct_age_18_29, d_pct_degree, d_pct_hh_no_car, d_pct_commute_transit,
                d_pct_commute_bicycle, d_pct_commute_walk, d_pct_commute_wfh, d_pct_jobs_retail_food]
  robustness_only: [month]

# Correlation filter, computed on INNER TRAIN only.
# For a pair with |rho| >= threshold, the feature appearing LATER in this list is dropped.
# The order is fixed in advance by interpretability, not by any association with the target.
correlation:
  threshold: 0.7
  sample_n: 300000
  keep_priority: [dist_km, temp_c, o_dist_cbd_km, d_dist_cbd_km, o_pct_age_18_29, d_pct_age_18_29,
                  o_median_income, d_median_income, o_pct_hh_no_car, d_pct_hh_no_car,
                  o_pct_degree, d_pct_degree, o_pop_density_km2, d_pop_density_km2,
                  o_pct_commute_transit, d_pct_commute_transit, o_pct_commute_bicycle, d_pct_commute_bicycle,
                  o_pct_commute_wfh, d_pct_commute_wfh, o_pct_jobs_retail_food, d_pct_jobs_retail_food,
                  precip_mm, precip_prev3h_mm, wind_kmh, humidity_pct, cloud_pct, snow_cm,
                  hour, is_daylight, is_member, is_weekend, day_of_week, is_holiday, round_trip, same_tract,
                  o_job_density_km2, d_job_density_km2, o_pct_commute_walk, d_pct_commute_walk,
                  o_median_age, d_median_age, feels_like_c]
